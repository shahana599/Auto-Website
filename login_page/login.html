<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto — Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --navy: #1A2E4A;
            --orange: #E55A2B;
            --bg: #F5F6F8;
            --white: #FFFFFF;
            --border: #E4E6EA;
            --text: #1A2E4A;
            --muted: #6B7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-auto {
            background: var(--navy);
            padding: 14px 0;
        }

        .logo {
            font-family: 'Sora', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .auth-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .auth-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
        }

        .auth-top {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .auth-icon svg {
            width: 26px;
            height: 26px;
        }

        .auth-top h1 {
            font-family: 'Sora', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .auth-top p {
            font-size: 13px;
            color: var(--muted);
        }

        .form-label-auto {
            font-size: 12px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 5px;
            display: block;
        }

        .form-control-auto {
            width: 100%;
            height: 46px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 0 14px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background: var(--white);
            transition: border-color 0.2s;
            outline: none;
        }

        .form-control-auto:focus {
            border-color: var(--navy);
        }

        .form-control-auto::placeholder {
            color: #b0b5bc;
        }

        .form-control-auto.error {
            border-color: #E24B4A;
        }

        .err-msg {
            font-size: 11px;
            color: #E24B4A;
            margin-top: 4px;
            display: none;
        }

        .err-msg.show {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .pass-wrap {
            position: relative;
        }

        .pass-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            padding: 0;
        }

        .forgot {
            text-align: right;
            margin-top: 4px;
        }

        .forgot a {
            font-size: 12px;
            color: var(--orange);
            text-decoration: none;
        }

        .btn-submit {
            background: var(--orange);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 13px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: #cc4e22;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .global-err {
            background: #FCEBEB;
            border: 1px solid #F09595;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #A32D2D;
            margin-bottom: 16px;
            display: none;
        }

        .global-err.show {
            display: block;
        }

        .auth-switch {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-top: 20px;
        }

        .auth-switch a {
            color: var(--orange);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        footer {
            background: var(--navy);
            padding: 20px 0;
            margin-top: auto;
        }

        .foot-copy {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <nav class="navbar-auto">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="index.html" class="logo">Auto</a>
            <a href="register.html" style="color:rgba(255,255,255,0.7);font-size:13px;text-decoration:none;">New here?
                <strong style="color:#fff;">Create account</strong></a>
        </div>
    </nav>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-top">
                <div class="auth-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                </div>
                <h1>Welcome back</h1>
                <p>Log in to your Auto account to continue.</p>
            </div>

            <div class="global-err" id="global-err">Email or password is incorrect. Please try again.</div>

            <div class="form-group">
                <label class="form-label-auto">Email address</label>
                <input type="email" class="form-control-auto" id="login-email" placeholder="e.g. rahul@email.com" />
                <div class="err-msg" id="err-email">Please enter your email address.</div>
            </div>

            <div class="form-group">
                <label class="form-label-auto">Password</label>
                <div class="pass-wrap">
                    <input type="password" class="form-control-auto" id="login-pass"
                        placeholder="Enter your password" />
                    <button class="pass-toggle" onclick="togglePass()" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="err-msg" id="err-pass">Please enter your password.</div>
                <div class="forgot"><a href="#">Forgot password?</a></div>
            </div>

            <button class="btn-submit" onclick="submitLogin()">Log in</button>

            <div class="auth-switch">Don't have an account? <a href="register.html">Sign up here</a></div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p class="foot-copy">© 2026 Auto. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function togglePass() {
            const inp = document.getElementById('login-pass');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        function submitLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            let hasError = false;

            document.getElementById('global-err').classList.remove('show');

            if (!email) {
                document.getElementById('login-email').classList.add('error');
                document.getElementById('err-email').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('login-email').classList.remove('error');
                document.getElementById('err-email').classList.remove('show');
            }

            if (!pass) {
                document.getElementById('login-pass').classList.add('error');
                document.getElementById('err-pass').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('login-pass').classList.remove('error');
                document.getElementById('err-pass').classList.remove('show');
            }

            if (hasError) return;

            const stored = JSON.parse(localStorage.getItem('auto_user') || '{}');
            if (stored.email && stored.email === email) {
                localStorage.setItem('auto_logged_in', 'true');
                window.location.href = '../home_page/Home.html';
            } else {
                document.getElementById('global-err').classList.add('show');
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') submitLogin();
        });
    </script>
</body>

</html>
